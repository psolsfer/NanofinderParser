

[tox]
basepython = python3
isolated_build = True
skip_missing_interpreters = true
envlist =
    py312,
    py313,
    py314,
    check,
    lint,
    docs,
    report

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314, check, lint, docs, report

[testenv]
# https://hynek.me/articles/turbo-charge-tox/ explains the inclusion of the next 2 lines
package = wheel
wheel_build_env = .pkg
setenv = PYTHONPATH = {toxinidir}
deps = tox-uv
skip_install = true
allowlist_externals = uv
commands_pre = uv pip install -e. --all-extras --group test -r ./pyproject.toml -q
commands =
    pytest --basetemp={envtmpdir} --junitxml=reports/pytest-{envname}.xml --cov --cov-append

[testenv:py314]
description = Run tests with coverage on Python 3.14
depends = clean
commands =
    pytest --basetemp={envtmpdir} --junitxml=reports/pytest-{envname}.xml --cov --cov-append

[testenv:check]
description = Format and check the code base
skip_install = true
commands =
    prek run --all-files --show-diff-on-failure

[testenv:lint]
description = Run all linting/formatting checks
basepython = python3.14
commands =
    ruff check src/nanofinderparser tests
    ruff format --check src/nanofinderparser tests

[testenv:type]
description = Run mypy checks
basepython = python3.12
commands =
    mypy --junit-xml reports/mypy.xml src/nanofinderparser

[testenv:docs]
description = Build documentation
commands_pre =
    uv pip install -e . --group docs -r ./pyproject.toml -q
commands =
    mkdocs build

[testenv:report]
description = Generate coverage reports
ignore_errors = True
commands =
    ; coverage combine
    coverage report
    coverage html

[testenv:clean]
description = Clean coverage data
commands =
    coverage erase
