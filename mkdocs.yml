site_name: NanofinderParser
repo_url: https://github.com/psolsfer/nanofinderparser
repo_name: NanofinderParser

site_dir: site

theme:
  name: material
  language: en
  #logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
    - navigation.top
    - navigation.footer

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.definition
  - pymdownx.blocks.details
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            # Headings
            show_root_heading: true
            # Docstrings
            # Signatures/annotations
            # Other
            show_bases: false
            show_source: false
            heading_level: 2
            inherited_members: true
            docstring_style: numpy
            show_root_toc_entry: true
            show_category_heading: true
            show_submodules: false
  - awesome-pages
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psolsfer
      name: GitHub
    - icon: material/email
      link: "mailto:psolsfer@gmail.com"

# Read the Docs configuration
site_url: https://nanofinderparser.readthedocs.io/
